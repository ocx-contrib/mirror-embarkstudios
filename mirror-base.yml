# Shared base for every spec in this repository (Embark Studios cargo plugins).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge.
#
# ⚠️ `platforms:` IS DELIBERATELY ABSENT FROM THIS FILE. The two packages here
# do NOT share a platform matrix, and the difference is not cosmetic:
#
#   cargo-deny  ships darwin/amd64 but NEVER ships windows/arm64.
#   cargo-about ships windows/arm64 but DROPPED darwin/amd64 at 0.9.0.
#
# They are mirror images of each other. A shared `platforms:` block would be
# wrong for both, and every spec that restated it to correct itself would
# silently drop the container legs with it (the shallow-merge trap). So the
# matrix lives in each package's own spec, in full, as `mirror-kitware` does
# when the matrix is downstream of a per-package measurement.

skip_prereleases: true
cascade: true

# Fleet rule for a new package: a cascade tag re-points on every re-publish, and
# without a build segment the new manifest reuses the bare version tag and
# orphans the prior digest for registry GC — breaking any `@sha256:` pin in a
# consumer's `ocx.lock`. The documented exception (a version that already
# carries semver build metadata, where `date` empties the mirror) does not
# apply: both packages tag plain `0.20.2` / `0.9.1` with no `+build` segment.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Assets are single static Rust binaries in a ~4.5 MB tar.gz each.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. Every upstream archive in this repo is
# a wrapper directory (`<tool>-<version>-<triple>/`) holding the executable next
# to README.md + LICENSE-APACHE + LICENSE-MIT, with NO `bin/` subdirectory. The
# wrapper's name embeds both the version and the target triple, so it cannot be
# named in a static PATH — `strip_components: 1` is the only workable choice,
# which puts the executable AT the content root and makes PATH a bare
# ${installPath}. `bin_scan` only looks BELOW an ${installPath}/<dir> entry, so
# `auto`/`verify` is rejected at spec load with exit 65. `off` plus a hand-listed
# `binaries` in metadata.json is the blessed shape for this layout.
bin_scan: off

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
